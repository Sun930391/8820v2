name: Build Custom Padavan for ZTE-E8820V2

on:
  workflow_dispatch:

env:
  FIRMWARE_AUTHOR: YourName
  TARGET_DEVICE: ZTE-E8820V2
  TOOLCHAIN: mipsel-linux-musl
  TOOLCHAIN_URL: https://github.com/TurBoTse/padavan/releases/download/toolchain/mipsel-linux-musl.tar.xz

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev jq ccache wget

      - name: Prepare Toolchain
        run: |
          wget -O toolchain.tar.xz ${TOOLCHAIN_URL}
          sudo mkdir -p /opt
          sudo tar -xJf toolchain.tar.xz -C /opt/
          echo "TOOLCHAIN_PATH=/opt/${{ env.TOOLCHAIN }}" >> $GITHUB_ENV

      - name: Create .config in Both Locations
        run: |
          mkdir -p trunk/configs/templates
          TEMPLATE="trunk/configs/templates/${{ env.TARGET_DEVICE }}.config"
          if [ ! -f "$TEMPLATE" ]; then
            cat << 'EOF' > "$TEMPLATE"
          CONFIG_FIRMWARE_PRODUCT_ID=ZTE-E8820V2
          CONFIG_LINUXDIR=linux-4.4.x
          CONFIG_CROSS_COMPILE=mipsel-linux-musl
          CONFIG_CROSS_COMPILER_ROOT=/opt/mipsel-linux-musl
          EOF
          fi

          cat << 'EOF' > .config
          CONFIG_CROSS_COMPILE=mipsel-linux-musl
          CONFIG_CROSS_COMPILER_ROOT=/opt/mipsel-linux-musl
          CONFIG_LINUXDIR=linux-4.4.x
          CONFIG_FIRMWARE_PRODUCT_ID=ZTE-E8820V2
          CONFIG_VENDOR=Ralink
          CONFIG_PRODUCT=MT7621
          CONFIG_FIRMWARE_TYPE_ROOTFS_IN_RAM=n
          CONFIG_CCACHE=n
          CONFIG_WITHOUT_KERNEL=n
          CONFIG_TFTPDIR=/tftpboot
          CONFIG_FIRMWARE_PERFORM_SSTRIP=y
          CONFIG_FIRMWARE_INCLUDE_XRAY=y
          CONFIG_FIRMWARE_ENABLE_USB=y
          CONFIG_USB_SUPPORT=y
          CONFIG_USB_OHCI=y
          CONFIG_USB_EHCI=y
          CONFIG_USB_XHCI=y
          CONFIG_USB_STORAGE=y
          CONFIG_FIRMWARE_ENABLE_FAT=y
          CONFIG_FIRMWARE_ENABLE_EXFAT=y
          CONFIG_FIRMWARE_ENABLE_EXT2=y
          CONFIG_FIRMWARE_ENABLE_EXT3=y
          CONFIG_FIRMWARE_INCLUDE_NTFS_3G=y
          CONFIG_FIRMWARE_INCLUDE_SMBD=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_SERIAL_WWAN=y
          CONFIG_USB_SERIAL_QCARRIER=y
          CONFIG_PPP=y
          CONFIG_PPP_ASYNC=y
          CONFIG_PPP_SYNC_TTY=y
          CONFIG_PPP_DEFLATE=y
          CONFIG_PPP_MPPE=y
          CONFIG_FIRMWARE_INCLUDE_PPPD=y
          CONFIG_FIRMWARE_INCLUDE_CHAT=y
          CONFIG_FIRMWARE_ENABLE_IPV6=y
          CONFIG_FIRMWARE_INCLUDE_LANG_CN=y
          CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=y
          CONFIG_FIRMWARE_INCLUDE_HTTPS=y
          CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y
          CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=y
          CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y
          CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y
          CONFIG_FIRMWARE_INCLUDE_CURL=y
          CONFIG_FIRMWARE_INCLUDE_VLMCSD=y
          CONFIG_FIRMWARE_INCLUDE_TTYD=y
          CONFIG_FIRMWARE_INCLUDE_MSD_LITE=y
          CONFIG_FIRMWARE_INCLUDE_IPERF3=y
          CONFIG_FIRMWARE_INCLUDE_IPSET=y
          CONFIG_FIRMWARE_INCLUDE_SFE=y
          EOF
          cp .config trunk/.config

      - name: Run Configure Script
        run: |
          cd trunk
          ./configure
          cd ..

      - name: Build Firmware
        run: |
          export PATH=${TOOLCHAIN_PATH}/bin:${PATH}
          # 关键修正：强制使用系统 gcc 编译 host 工具
          make HOSTCC=gcc HOSTCXX=g++ ${{ env.TARGET_DEVICE }}

      - name: Prepare Output
        run: |
          mkdir -p trunk/output
          BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)
          BASE_NAME="${FIRMWARE_AUTHOR}-${TARGET_DEVICE}-4.4-${TOOLCHAIN}-${BUILD_DATE}"
          i=1
          for f in trunk/images/*.trx; do
            if [ -f "$f" ]; then
              suffix=""
              [ $i -gt 1 ] && suffix="-$i"
              mv "$f" "trunk/output/${BASE_NAME}${suffix}.trx"
              i=$((i+1))
            fi
          done

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_DEVICE }}-firmware
          path: trunk/output/*.trx
