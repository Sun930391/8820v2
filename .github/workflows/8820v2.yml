name: Build Padavan for ZTE-E8820V2 with xray & USB Modem

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          cd ..

      - name: Customize ZTE-E8820V2 config (enable USB, storage, modem & PPP)
        run: |
          cd trunk/configs/templates/
          # 确保使用正确的配置文件名
          echo "CONFIG_USB_SUPPORT=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_OHCI=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_EHCI=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_XHCI=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_STORAGE=y" >> ZTE-E8820V2.config
          echo "CONFIG_FIRMWARE_INCLUDE_NTFS_3G=y" >> ZTE-E8820V2.config
          echo "CONFIG_FIRMWARE_INCLUDE_EXFAT=y" >> ZTE-E8820V2.config
          echo "CONFIG_FIRMWARE_INCLUDE_SMBD36=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_SERIAL=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_SERIAL_OPTION=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_SERIAL_WWAN=y" >> ZTE-E8820V2.config
          echo "CONFIG_USB_SERIAL_QCARRIER=y" >> ZTE-E8820V2.config
          echo "CONFIG_PPP=y" >> ZTE-E8820V2.config
          echo "CONFIG_PPP_ASYNC=y" >> ZTE-E8820V2.config
          echo "CONFIG_PPP_SYNC_TTY=y" >> ZTE-E8820V2.config
          echo "CONFIG_PPP_DEFLATE=y" >> ZTE-E8820V2.config
          echo "CONFIG_PPP_MPPE=y" >> ZTE-E8820V2.config
          echo "CONFIG_FIRMWARE_INCLUDE_PPPD=y" >> ZTE-E8820V2.config
          echo "CONFIG_FIRMWARE_INCLUDE_CHAT=y" >> ZTE-E8820V2.config
          cd ../../..

      - name: Download xray
        run: |
          XRAY_URL="https://github.com/Sun930391/padavan-4.4/raw/refs/heads/main/xray"
          wget -O /tmp/xray ${XRAY_URL}
          chmod +x /tmp/xray

      - name: Modify build script to include xray
        run: |
          cd trunk
          # 确保 sed 命令正确插入复制 xray 的指令（适配新配置名）
          sed -i '/^[[:space:]]*make[[:space:]]/a \\tcp /tmp/xray $${ROMFSDIR}/usr/bin/\\n\\tchmod 755 $${ROMFSDIR}/usr/bin/xray' build_firmware_modify
          cd ..

      - name: Debug board configs
        run: |
          echo "Listing trunk/configs/boards/:"
          ls -la trunk/configs/boards/ || echo "boards/ not exist"
          echo "Looking for ZTE-E8820V2 subdir:"
          ls -la trunk/configs/boards/ZTE-E8820V2/ 2>/dev/null || echo "No ZTE-E8820V2 dir"

      - name: Fix kernel config if needed
        run: |
          cd trunk
          if [ ! -f configs/boards/kernel-4.4.x.config ]; then
            echo "kernel-4.4.x.config not found, attempting to copy from ZTE-E8820V2/"
            if [ -f configs/boards/ZTE-E8820V2/kernel.config ]; then
              cp configs/boards/ZTE-E8820V2/kernel.config configs/boards/kernel-4.4.x.config
              echo "Copied kernel.config to kernel-4.4.x.config"
            elif [ -f configs/boards/ZTE-E8820V2/config ]; then
              cp configs/boards/ZTE-E8820V2/config configs/boards/kernel-4.4.x.config
              echo "Copied config to kernel-4.4.x.config"
            else
              echo "No suitable kernel config found in ZTE-E8820V2/, please check manually."
              exit 1
            fi
          else
            echo "kernel-4.4.x.config already exists."
          fi
          cd ..

      - name: Build firmware
        run: |
          cd trunk
          # 使用新的配置名作为参数
          fakeroot ./build_firmware_modify ZTE-E8820V2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: padavan-zte-e8820v2-with-xray
          path: trunk/images/*.trx
